[build-system]
requires = ["setuptools>=68", "setuptools-rust>=1.9,<2", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "nasduck"
version = "0.1.1"
description = "Python bindings for nasduck terminal automation"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "NASDUCK" }]
keywords = ["terminal", "pty", "automation", "testing", "tui", "nasduck"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/shiplaone2q/nasduck"
Repository = "https://github.com/shiplaone2q/nasduck"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nasduck = ["*.pyi", "py.typed"]
